<!DOCTYPE html>
<html lang="id">

<head>

<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Administrator | LENTERA RR</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="assets/css/style.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-lg-5">

<div class="card shadow-lg border-0">

<div class="card-body p-5">

<div class="text-center mb-4">

<img
src="assets/images/logo-bpbd.png"
height="90">

<h2 class="mt-3">

LENTERA RR

</h2>

<p>

Administrator Portal

</p>

</div>

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
id="username"
class="form-control">

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
id="password"
class="form-control">

</div>

<div class="d-grid">

<button
class="btn btn-primary"
onclick="login()">

<i class="bi bi-box-arrow-in-right me-2"></i>

Masuk

</button>

</div>

<hr>

<div class="text-center">

<a
href="index.html">

← Kembali ke Beranda

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

async function login(){

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value.trim();

    if(username==="" || password===""){

        alert("Username dan Password wajib diisi.");

        return;

    }

    try{

        const response = await fetch(

            "https://script.google.com/macros/s/AKfycbywxhFe7g8JDoWTzoRktls2MaTJgaz4ttXnCTGs0p9VceJnzah2JfS3HiGkGUUkLgI2/exec?action=login"

        ,{

            method:"POST",

            body:JSON.stringify({

                action:"login",

                username:username,

                password:password

            })

        });

        const hasil = await response.json();

        if(hasil.success){

            sessionStorage.setItem("login","true");

            sessionStorage.setItem("nama",hasil.nama);

            sessionStorage.setItem("role",hasil.role);

            window.location="admin.html";

        }else{

            alert(hasil.pesan);

        }

    }catch(err){

        console.error(err);

        alert("Tidak dapat terhubung ke server.");

    }

}

</script>

</body>

</html>
